name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake
          pip install buildozer "cython==0.29.36" setuptools
      - name: Compilar
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log
      - name: Mostrar causa del error
        if: failure()
        run: |
          java -version
          grep -n -A25 "What went wrong" build.log | tail -n 60 || true
          tail -n 40 build.log
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
